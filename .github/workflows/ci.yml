name: CI

# Verify on Linux, macOS and Windows for public-repository pushes and pull requests.
# Weekly and manual runs remain available; documentation-only changes skip hosted jobs.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'devlog/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'devlog/**'
      - '*.md'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      os:
        description: 'Runner OS for the verify and browser jobs (all = Ubuntu, macOS and Windows)'
        type: choice
        default: ubuntu
        options: [ubuntu, macos, windows, all]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Push, pull request, schedule or dispatch "all": all three. Other dispatches: the chosen OS.
        os: ${{ fromJSON((contains('push pull_request schedule', github.event_name) || inputs.os == 'all') && '["ubuntu-latest","macos-latest","windows-latest"]' || format('["{0}-latest"]', inputs.os)) }}
    steps:
      # Byte-exact fixtures (theme snapshot hash) must not see CRLF conversion on Windows.
      - name: Disable line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # NODE_ENV is unset on hosted runners; devDependencies (tsc, tsx) are required.
      - name: Install
        run: npm ci --include=dev
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      # scripts/test-unit.mjs isolates HOME, provider commands and (on Linux, when permitted) the
      # network. The shell-script provider stubs and the network namespace only apply on POSIX hosts.
      - name: Unit tests
        # A hung test must fail the step with output instead of holding the runner for the job limit.
        timeout-minutes: 20
        run: npm run test:unit
      # Optional operator-held patterns (names, hosts) for the audit. The secret is written to a
      # temporary file and exposed only as ARCO_PRIVATE_PATTERNS_FILE; absent secret = no-op.
      - name: Load private audit patterns
        env:
          ARCO_PRIVATE_PATTERNS: ${{ secrets.ARCO_PRIVATE_PATTERNS }}
        run: |
          if [ -n "$ARCO_PRIVATE_PATTERNS" ]; then
            printf '%s\n' "$ARCO_PRIVATE_PATTERNS" > "$RUNNER_TEMP/arco-private-patterns"
            echo "ARCO_PRIVATE_PATTERNS_FILE=$RUNNER_TEMP/arco-private-patterns" >> "$GITHUB_ENV"
          else
            echo "No ARCO_PRIVATE_PATTERNS secret; using built-in rules only."
          fi
      - name: Public-safety audit (tree)
        run: npm run audit:public -- --tree
      # A fresh CI checkout holds only branch refs, so --history covers everything. Locally,
      # refs/arco/* checkpoint refs make --history fail; use --release-history there (it
      # inspects branches, tags and remotes only).
      - name: Public-safety audit (history, identity and trailers)
        if: matrix.os == 'ubuntu-latest'
        # Private patterns apply to the tree and staged scans only: older commits legitimately
        # contain the upstream name and fixture addresses. An empty value makes the script fall
        # back to its (absent) repository-local pattern file.
        env:
          ARCO_PRIVATE_PATTERNS_FILE: ''
        run: node scripts/public-audit.mjs --history
      - name: Help registry check
        run: npm run docs:check
      - name: Documentation link check
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:docs

  # The browser and docker jobs do not wait for the verify matrix: a macOS or Windows failure must
  # not hide the Linux browser and container results.
  browser:
    name: browser smokes (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || inputs.os == 'ubuntu' || inputs.os == 'all'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --include=dev
      - name: Install Playwright Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          echo "ARCO_TEST_CHROME=$(python3 -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Browser smokes (fixture APIs, no providers)
        run: node scripts/smoke/run-browser-suites.mjs

  # macOS and Windows browser runs are best effort until the platform work in P2.2 stabilizes them.
  browser-other:
    name: browser smokes (${{ matrix.os }}, best effort)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20
    # Never on push or pull request: only the weekly schedule and a dispatch that selects them.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.os != 'ubuntu')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || inputs.os == 'all') && '["macos-latest","windows-latest"]' || format('["{0}-latest"]', inputs.os)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --include=dev
      - name: Install Playwright Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install chromium
          echo "ARCO_TEST_CHROME=$(python3 -c 'from playwright.sync_api import sync_playwright as s; p=s().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Browser smokes
        run: node scripts/smoke/run-browser-suites.mjs

  # Runs only once the container baseline (P2.1) has landed a Dockerfile.
  docker:
    name: docker smoke (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' || inputs.os == 'ubuntu' || inputs.os == 'all'
    steps:
      - uses: actions/checkout@v4
      - name: Detect Dockerfile
        id: detect
        run: |
          if [ -f Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install smoke dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm ci --include=dev
      # smoke:docker builds arco:development itself and drives it with temporary projects, volumes and fixture providers.
      - name: Docker smoke
        if: steps.detect.outputs.present == 'true'
        run: npm run smoke:docker
