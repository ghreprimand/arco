<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 28" preserveAspectRatio="none" width="400" height="28">
  <!--
    Solar Paper "deckle" — a torn paper edge tileable along x. The path draws
    a jagged shoulder across the top with random-ish notches; the rectangle
    below it fills to the bottom so the SVG can be applied as a bottom-aligned
    background-image or mask-image strip (the jagged edge faces the viewport
    edge, the solid bottom meets the panel / body content).
  -->
